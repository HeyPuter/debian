# The Debian openssl target for musl-linux-wasm32 (debian/rules configures
# debian-$(DEB_HOST_ARCH)), read through OPENSSL_LOCAL_CONFIG_DIR. Debian's
# own "debian" base is left out: its -Wa,--noexecstack and
# -fzero-call-used-regs have no meaning for wasm. No assembly (generic C).
my %targets = (
    "debian-musl-linux-wasm32" => {
        inherit_from => [ "linux-generic32" ],
        cflags       => add("-Wall"),
    },
);
