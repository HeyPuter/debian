<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDE Plasma on gex</title>
<style>
  :root { --bg: #1b1e20; --fg: #fcfcfc; --dim: #a1a9b1; --bar: #3daee9; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 "Noto Sans", system-ui, sans-serif; overflow: hidden; }
  #desk { position: fixed; inset: 0; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: var(--bg); z-index: 1; transition: opacity .4s; }
  #load.gone { opacity: 0; pointer-events: none; }
  #load h1 { font-weight: 300; font-size: 22px; margin: 0; }
  #meter { width: min(420px, 80vw); height: 4px; background: #31363b; border-radius: 2px; overflow: hidden; }
  #meter > div { height: 100%; width: 0; background: var(--bar); transition: width .2s; }
  #what { color: var(--dim); font-size: 12px; min-height: 1.4em; text-align: center; max-width: 80vw; }
  #log { display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 40vh; overflow: auto;
    margin: 0; padding: 8px 16px; background: #000c; color: #ddd; font: 11px/1.3 monospace; z-index: 2;
    white-space: pre-wrap; }
  body.log #log { display: block; }
</style>
</head>
<body>
<div id="desk"></div>
<div id="load"><h1>KDE Plasma</h1><div id="meter"><div></div></div><div id="what">starting</div></div>
<pre id="log"></pre>
<script type="module">
// The Debian arm64 KDE session, booted straight to the desktop: bash runs
// gex-kde-session (the tree's /usr/local/bin), which starts startplasma-x11
// on the page's X server. The X server is rootful (one fullscreen screen
// under KWin, which draws the decorations). `?log=1` shows the session's
// output; `?size=WxH` fixes the desktop's size (default: the window's).
import { start } from './app.mjs';
const q = new URLSearchParams(location.search);
const load = document.getElementById('load');
const bar = document.querySelector('#meter > div');
const what = document.getElementById('what');
const logEl = document.getElementById('log');
if (q.get('log') === '1') document.body.classList.add('log');
const site = await (await fetch('site.json')).json();
let out = '';
const t0 = performance.now();
globalThis.__kde = { phase: 'loading', out: '', t0 };
const app = await start({
  container: document.getElementById('desk'),
  size: q.get('size') || 'fit',
  // any other parameter is a runtime switch (?strace=1&stracepid=23, ?heartbeat=N)
  debug: Object.fromEntries([...q].filter(([k]) => k !== 'log' && k !== 'size')),
  baseUrl: new URL('./', location.href),
  hostx: 'rootful',
  ready: 'frame',
  build: {
    arch: 'aarch64',
    tar: site.tar,
    pack: 'pack.json',
    zstd: 'vendor/zstddec-stream.mjs',
    exe: '/usr/bin/bash',
    // the program's arguments, after argv[0] (app.js puts `exe` first)
    argv: ['/usr/local/bin/gex-kde-session'],
    env: ['PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', 'HOME=/root', 'TERM=xterm-256color',
          'LANG=C.UTF-8', 'XDG_RUNTIME_DIR=/run/user/0', 'DISPLAY=:0', ...(site.env ?? [])],
    cwd: '/root',
    // the tree's file and directory times: KService compares them with its
    // database's, and rebuilds it (minutes) when they look newer
    mtimes: true,
    uid: 0,
    size: 'fit',
    featuresOff: [],
    compositor: true,
    jitFallback: true,
    gl: false,
    hostx: true,
    hostxRootful: true,
    switches: site.switches ?? {},
  },
  onLog: (s) => {
    out += s;
    globalThis.__kde.out = out;
    if (q.get('log') === '1') { logEl.textContent = out.slice(-20000); logEl.scrollTop = logEl.scrollHeight; }
  },
  onProgress: (p) => {
    const d = p.download;
    if (p.phase === 'download' && d.total) {
      bar.style.width = `${Math.round((d.done / d.total) * 100)}%`;
      what.textContent = `downloading ${(d.done / 1048576).toFixed(0)} of ${(d.total / 1048576).toFixed(0)} MiB`;
    } else if (p.phase === 'boot' || p.phase === 'compile') {
      bar.style.width = '100%';
      what.textContent = p.boot.program ? `starting ${p.boot.program}` : 'starting the session';
    }
    if (p.phase === 'ready') {
      globalThis.__kde.phase = 'ready';
      globalThis.__kde.readyMs = Math.round(performance.now() - t0);
      load.classList.add('gone');
    }
  },
});
globalThis.__kde.app = app;
app.exited.then((s) => {
  globalThis.__kde.phase = 'exited';
  globalThis.__kde.status = s;
  what.textContent = `the session ended (${s})`;
  load.classList.remove('gone');
});
</script>
</body>
</html>
