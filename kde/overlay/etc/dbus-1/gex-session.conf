<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The session bus (gex-kde-session hands it to dbus-run-session). A
     service started on demand may take minutes to come up while gex
     translates its libraries the first time; dbus-daemon's two minutes give
     up on it (kactivitymanagerd, and with it plasmashell). session.conf sets
     its limits after it includes session-local.conf, so they are raised
     here, after session.conf. -->
<busconfig>
  <include>/usr/share/dbus-1/session.conf</include>
  <limit name="service_start_timeout">900000</limit>
  <limit name="auth_timeout">900000</limit>
</busconfig>
