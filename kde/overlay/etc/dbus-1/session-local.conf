<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A service started on demand may take minutes to come up while gex
     translates its libraries the first time; dbus-daemon's default of two
     minutes gives up on it (kactivitymanagerd, and with it plasmashell). -->
<busconfig>
  <limit name="service_start_timeout">900000</limit>
</busconfig>
